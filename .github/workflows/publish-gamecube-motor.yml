name: Publish GameCube motor review branch
on:
  push:
    branches: [qa/publish-gamecube-motor]
    paths: [.github/workflows/publish-gamecube-motor.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/gamecube-motor-rumble
          fetch-depth: 1
      - name: Apply exact reviewed edits and publish without a force push
        env:
          PAYLOAD: >-
            
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e7f5dffb0c0e7420212775f66dd244e9217d5834
          python3 - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          for edit in json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD']))):
              path = Path(edit['path'])
              assert not path.is_absolute() and '..' not in path.parts
              original = path.read_text() if path.exists() else ''
              if edit['old'] is None:
                  assert not path.exists()
              else:
                  assert hashlib.sha256(original.encode()).hexdigest() == edit['old'], path
              lines = original.splitlines(keepends=True)
              for start, end, replacement in reversed(edit['ops']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(lines))
          PY
          git diff --check
          git add -A
          test "$(git write-tree)" = ede684f77a8c83378d449dc28ed9a9eb26920abe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Support NSO GameCube motor rumble through the native transport and SDL' -m 'Add a dedicated on/off BLE motor packet and channel, retain firmware feedback presets, support continuous/pulse operations through the C API, and test stop/expiry/backpressure/retirement. AI-assisted; physical rumble remains to be confirmed.'
          git push origin HEAD:refs/heads/feature/gamecube-motor-rumble
