name: SDK package compatibility validation
on:
  push:
    branches: [maintenance/ios-package-port]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de2514bc687df810ea804449c8d5c0e88c4702bd
          persist-credentials: false
      - name: Existing policy and repository checks
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-policy"
          "$RUNNER_TEMP/ci-policy/bin/pip" install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          "$RUNNER_TEMP/ci-policy/bin/python" -m unittest discover -s .github/ci -p 'test_*.py' -v
          bash tests/repository/run.sh
          bash tests/distribution-notices/run.sh
          bash tests/app-identity/run.sh
          python3 scripts/switch2kit/check-boundaries.py
  macos:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de2514bc687df810ea804449c8d5c0e88c4702bd
          persist-credentials: false
      - name: Existing complete package and portable regression suite
        run: |
          swift --version
          xcodebuild -version
          bash tests/run.sh
      - name: Actual package on iOS Simulator and device
        run: |
          xcodebuild -scheme Switch2Kit -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme Switch2Kit -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build
      - name: Existing independent public Swift consumer
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/verify-switch2kit-consumer.sh"
      - name: Existing demo, app, signing and runtime checks
        run: |
          bash scripts/build-switch2kit-demo.sh
          bash scripts/build-app.sh
          codesign --verify --strict "build/Switch2Kit.app"
          plutil -lint "build/Switch2Kit.app/Contents/Info.plist"
          bash scripts/check-runtime.sh
  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    timeout-minutes: 8
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de2514bc687df810ea804449c8d5c0e88c4702bd
          persist-credentials: false
      - name: Existing native-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build make g++ python3 dbus libsystemd0 pkg-config
          git config --global --add safe.directory "$PWD"
      - name: Existing Linux package and private-D-Bus regressions
        run: |
          swift --version
          swift test -Xswiftc -warnings-as-errors
          bash tests/linux-bluez/run.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libsdl-org/SDL
          ref: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
          path: build/SDL
          persist-credentials: false
      - name: Existing real SDL host and adapter checks
        env:
          S2K_SDL_SOURCE: ${{ github.workspace }}/build/SDL
          S2K_EXPECT_SDL_VERSION: 3004016
        run: bash tests/emulator-host/verify.sh 2>&1 | tee native-host.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: linux-native-host
          path: native-host.log
          retention-days: 1
  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: de2514bc687df810ea804449c8d5c0e88c4702bd
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - name: Existing WinRT package and release facade checks
        shell: pwsh
        run: |
          swift --version
          swift test -Xswiftc -warnings-as-errors 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build -c release --product Switch2KitC 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: windows-native
          path: windows-*.log
          retention-days: 1
  result:
    needs: [preflight, macos, linux, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every native platform to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          assert len(results)==4 and all(job['result']=='success' for job in results.values()), results
          print('All existing native-platform checks passed against the SDK package PR revision.')
          PY
