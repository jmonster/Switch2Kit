name: Apply reviewed final controller boundaries
on:
  push:
    branches: [refactor/switch2kit-library]
    paths: [.github/switch2kit-final-boundaries.py, .github/workflows/switch2kit-final-boundaries.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jmonster/Switch2Kit' && github.ref == 'refs/heads/refactor/switch2kit-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply reviewed code and explicit host identity correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f05c42215ff9b5e66f5e9bde128b53bbfaf0d6b1
          python3 .github/switch2kit-final-boundaries.py
          git add -- Sources Examples Resources/Info.plist scripts/notarize-release.py tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound generation-routed operations, fix demo isolation, and honor requested host identity'
          git push origin HEAD:refs/heads/refactor/switch2kit-library
          git rev-parse HEAD
