name: In-process SDL3 native consumers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdl-inprocess-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libsdl-org/SDL
          ref: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
          path: build/SDL
          persist-credentials: false
      - name: Record exact input dependency
        run: test "$(git -C build/SDL rev-parse HEAD)" = fa2c02bb6e21974a89ea9824bc53c9932abe5f9c
      - name: Verify native consumers from an unrelated checkout path with spaces
        env:
          S2K_SDL_SOURCE: ${{ github.workspace }}/build/SDL
          S2K_EXPECT_SDL_VERSION: 3004016
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # A noncanonical name with whitespace also covers the quoting regression.
          checkout="$work/Native SDK-checkout"
          mkdir "$checkout"
          git archive HEAD | tar -x -C "$checkout"
          (
            cd "$work"
            bash "$checkout/tests/c-consumer/run.sh"
            bash "$checkout/tests/sdl-inprocess/verify.sh"
          )
