name: Emulator integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
concurrency:
  group: emulator-integration-${{ github.ref }}
  # Validate the current PR head instead of queueing it behind superseded builds.
  cancel-in-progress: true
jobs:
  host:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libsdl-org/SDL
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: build/SDL
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cemu-project/Cemu
          ref: 3310f3b8b184d64a62b89fd59088c799432badf5
          path: build/Cemu-motion
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dolphin-emu/dolphin
          ref: c185d27ede09771fe93a3b520c576f646f937ed9
          path: build/Dolphin-motion
          persist-credentials: false
      - name: Install headers and patch the actual Dolphin motion consumer
        run: |
          brew install boost fmt
          python3 Integrations/Emulators/apply.py dolphin build/Dolphin-motion
      - name: Exercise application lifecycle and concurrent enumeration
        env:
          S2K_SDL_SOURCE: ${{ github.workspace }}/build/SDL
          S2K_CEMU_SOURCE: ${{ github.workspace }}/build/Cemu-motion
          S2K_DOLPHIN_SOURCE: ${{ github.workspace }}/build/Dolphin-motion
        run: bash tests/emulator-host/verify.sh
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - emulator: dolphin
            os: macos-15
            architecture: arm64
            repository: dolphin-emu/dolphin
            revision: c185d27ede09771fe93a3b520c576f646f937ed9
          - emulator: cemu
            os: macos-15
            architecture: arm64
            repository: cemu-project/Cemu
            revision: 3310f3b8b184d64a62b89fd59088c799432badf5
          - emulator: dolphin
            os: macos-15-intel
            architecture: x86_64
            repository: dolphin-emu/dolphin
            revision: c185d27ede09771fe93a3b520c576f646f937ed9
          - emulator: cemu
            os: macos-15-intel
            architecture: x86_64
            repository: cemu-project/Cemu
            revision: 3310f3b8b184d64a62b89fd59088c799432badf5
    env:
      S2K_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      VCPKG_MAX_CONCURRENCY: 3
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-cache,readwrite
      S2K_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: build/emulator-source
          submodules: recursive
          persist-credentials: false
      - name: Check the native runner and retain the pinned source
        env:
          EMULATOR: ${{ matrix.emulator }}
          REVISION: ${{ matrix.revision }}
        run: |
          test "$(uname -m)" = "$S2K_EXPECTED_ARCHITECTURE"
          test "$(git -C build/emulator-source rev-parse HEAD)" = "$REVISION"
          if [ "$S2K_EXPECTED_ARCHITECTURE" = arm64 ]; then
            git -C build/emulator-source archive HEAD -o "$RUNNER_TEMP/$EMULATOR-source.zip"
          fi
      - name: Preserve the exact upstream source for patch reproductions
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.emulator }}-pinned-source
          path: ${{ runner.temp }}/${{ matrix.emulator }}-source.zip
          if-no-files-found: error
          retention-days: 7
      - name: Install native build tools
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: |
          brew install cmake ninja nasm automake libtool
          if [ "$EMULATOR" = dolphin ]; then brew install qt@6; else brew install molten-vk; fi
          mkdir -p build/vcpkg-cache
          if [ "$EMULATOR" = cemu ]; then bash build/emulator-source/dependencies/vcpkg/bootstrap-vcpkg.sh; fi
      - name: Apply the pinned integration
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: python3 Integrations/Emulators/apply.py "$EMULATOR" build/emulator-source
      - name: Build the complete emulator application
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: |
          set -o pipefail
          extra=(-DCMAKE_OSX_ARCHITECTURES="$S2K_EXPECTED_ARCHITECTURE")
          if [ "$EMULATOR" = dolphin ]; then
            extra+=(-DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DENABLE_VULKAN=OFF -DENABLE_TESTS=OFF -DPOSTPROCESS_BUNDLE=ON)
          else
            extra+=(-DENABLE_VULKAN=ON)
          fi
          bash scripts/build-switch2kit-emulator.sh "$EMULATOR" \
            "$PWD/build/emulator-source" "$PWD/build/emulator-build" \
            "${extra[@]}" 2>&1 | tee build/emulator-build.log
      - name: Inspect the app and embedded controller library
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: python3 Integrations/Emulators/verify-bundle.py "$EMULATOR" build/emulator-source build/emulator-build --architecture "$S2K_EXPECTED_ARCHITECTURE"
      - name: Configure without Switch2Kit and retain upstream deployment behavior
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: |
          set -o pipefail
          extra=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                 -DCMAKE_OSX_ARCHITECTURES="$S2K_EXPECTED_ARCHITECTURE" -DENABLE_SDL=ON
                 -DENABLE_SWITCH2KIT=OFF -DSWITCH2KIT_SOURCE_DIR=/must-not-be-used)
          if [ "$EMULATOR" = dolphin ]; then
            extra+=(-DENABLE_QT=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
                    -DENABLE_VULKAN=OFF -DENABLE_TESTS=OFF -DPOSTPROCESS_BUNDLE=OFF)
          else
            # Do not regenerate or overwrite the already inspected Cemu app bundle.
            extra+=(-DMACOS_BUNDLE=OFF -DENABLE_VULKAN=ON)
          fi
          cmake -S "$PWD/build/emulator-source" -B "$PWD/build/emulator-disabled" \
            "${extra[@]}" 2>&1 | tee build/emulator-disabled-configure.log
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          build = Path('build/emulator-disabled')
          rows = json.loads((build / 'compile_commands.json').read_text())
          assert rows and not any('HAVE_SWITCH2KIT' in row['command'] for row in rows)
          assert not any('Switch2KitSDL3.cpp' in row['file'] for row in rows)
          ninja = (build / 'build.ninja').read_text()
          assert 'build Switch2KitCBuild:' not in ninja
          filename, minimum = ('SDL.cpp', '11.0.0') if os.environ['EMULATOR'] == 'dolphin' else ('SDLController.cpp', '13.4')
          commands = [row['command'] for row in rows if Path(row['file']).name == filename]
          assert commands and all('-mmacosx-version-min=' + minimum in command for command in commands)
          print('PASS disabled backend: no SDK target, original macOS deployment target ' + minimum)
          PYTHON
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.emulator }}-${{ matrix.architecture }}-integration-diagnostics
          path: |
            build/emulator-build.log
            build/emulator-disabled-configure.log
            build/emulator-disabled/CMakeCache.txt
            build/emulator-disabled/compile_commands.json
            build/emulator-build/integration-native-diagnostics.txt
            build/emulator-build/integration-inspection.json
            build/emulator-build/build.ninja
            build/emulator-build/CMakeCache.txt
            build/emulator-build/compile_commands.json
            build/emulator-build/CMakeFiles/CMakeConfigureLog.yaml
            build/emulator-build/vcpkg-manifest-install.log
            build/emulator-build/**/Info.plist
            build/emulator-source/bin/**/Info.plist
          retention-days: 7
      - name: Preserve the built emulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.emulator }}-${{ matrix.architecture }}-switch2kit-app
          path: build/emulator-build/integration-app.zip
          if-no-files-found: error
          retention-days: 7
