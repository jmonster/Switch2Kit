name: macOS build and regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          swift --version
          xcodebuild -version
          git archive HEAD -o "$RUNNER_TEMP/source.zip"
      - name: Describe and build the Swift package with Apple SDKs
        run: |
          swift package describe
          swift build
      - name: Build the independent example and its Bluetooth host bundle
        run: |
          swift build --product Switch2KitDemo
          bash scripts/build-switch2kit-demo.sh
      - name: Run Swift 6 package and output regressions (no radio required)
        run: bash tests/run.sh
      - name: Build the actual app bundle (ad-hoc signing only)
        run: |
          bash scripts/build-app.sh
          codesign --verify --strict "build/Switch2Kit.app"
          plutil -lint "build/Switch2Kit.app/Contents/Info.plist"
      - name: Verify and package the tested development app
        run: bash scripts/package-dev.sh
      - name: Preserve the tested application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switch2kit-development-app
          path: build/distribution/
          retention-days: 14
      - name: Preserve exact tested source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 7
